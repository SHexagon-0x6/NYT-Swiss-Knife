  *{box-sizing:border-box}html{background:#fff;scroll-behavior:auto}body{margin:0;font:14px Arial,sans-serif;color:#121212}.top-spacer{height:96px}.bottom-spacer{height:700px}#fixtures{width:min(700px,calc(100% - 24px));margin:auto;height:640px;display:flex;align-items:center;justify-content:center}.native-column{width:100%;max-width:600px;flex:none}.native-column button{font:inherit;background:#fff;color:#121212;border:1px solid #aaa;border-radius:3px}.native-actions{height:42px;display:flex;align-items:center;justify-content:center;gap:10px}.native-actions button{padding:7px 14px}.connections-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:100%;max-width:480px;margin:auto}.connections-grid button{height:58px;background:#efefe6;font-size:12px;font-weight:bold}.su-game{display:flex;align-items:center;justify-content:center;gap:20px}.su-board{width:324px;aspect-ratio:1;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));flex:none}.su-cell{position:relative;border-radius:0!important;font-size:20px!important;min-width:0}.su-keyboard{width:205px;flex:none}.su-keyboard__split{display:flex}.su-keyboard__split button{flex:1;height:32px}.su-candidates{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.su-candidate-button{height:35px}.su-keyboard__auto{display:flex;font-size:11px;gap:5px;margin-top:12px}.native-wordle{width:320px;max-width:100%;margin:auto}.wordle-board{width:240px;margin:auto}.wordle-row{display:grid;grid-template-columns:repeat(5,44px);gap:5px;margin-bottom:5px}.wordle-tile{display:grid;place-items:center;height:42px;border:2px solid #d3d6da;font-weight:bold}.native-keyboard{display:flex;align-items:center;justify-content:center;gap:6px;height:58px}.native-keyboard button{height:36px;padding:0 12px;background:#d3d6da}.xwd__layout{display:flex;justify-content:center;align-items:flex-start;gap:22px}.crossword-grid{display:grid;grid-template-columns:repeat(5,40px);width:200px;height:200px;border:1px solid #121212}.crossword-grid button{position:relative;height:40px;border-radius:0;font-size:10px;text-align:left;align-content:start;padding:3px}.crossword-clues{width:190px;font-size:12px}.crossword-clues h3{font-size:13px;margin:0 0 6px}.crossword-clues ol{padding-left:20px;margin:0 0 14px}.crossword-clues li{padding:3px 0}.bonus-board{display:block;width:250px;height:250px;flex:none}.bonus-board rect{fill:#fff;stroke:#111;stroke-width:1}.bonus-board text{font:9px Arial,sans-serif;fill:#111}#results{position:fixed;right:0;top:0;max-width:540px;max-height:140px;overflow:auto;white-space:pre-wrap;margin:0;background:#f6f6f6e8;font:10px/1.3 monospace;z-index:2147483647;pointer-events:none}.layout-frame{position:fixed;left:0;top:0;border:0;background:white}body[data-layout-child] #results{display:none}
