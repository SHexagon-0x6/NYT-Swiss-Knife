<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Connections Submit groups checks</title>
<style>
  body{margin:24px;font:14px Arial,Helvetica,sans-serif}main{width:620px}
  [data-testid="connections-board"]{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  [data-testid="card-label"]{display:grid;place-items:center;height:70px;border-radius:6px;background:#efefe6;font-weight:700;cursor:pointer;user-select:none}
  [data-testid="card-label"][class*="selected"]{background:#5a594e;color:#fff}
  [data-testid="solved-category"]{display:block;margin:0 0 8px;padding:10px;border-radius:6px}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .actions{display:flex;gap:10px;justify-content:center;margin:14px 0}.actions button{height:44px;padding:0 18px;border:1px solid #222;border-radius:22px;background:#fff}
  #results{white-space:pre-wrap;font:12px/1.6 monospace}
</style>
<main>
  <p>Create four groups of four!</p>
  <div id="solved"></div>
  <div data-testid="connections-board"></div>
  <div data-margin-mistakes><span data-margin-mistake>●</span><span data-margin-mistake>●</span><span data-margin-mistake>●</span><span data-margin-mistake>●</span></div>
  <div class="actions"><button type="button">Shuffle</button><button type="button" id="deselect">Deselect All</button><button type="button" id="submit" disabled>Submit</button></div>
  <div data-margin-feedback role="status"></div>
  <div id="margin-host"></div>
</main>
<pre id="results">Running</pre>
<script src="../games/connections.js"></script>
<script>
(async () => {
  const results = [], slots = new Map();
  const assert = (condition, message) => { if (!condition) throw Error(message); results.push(`PASS ${message}`); };
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const until = async (check, message, ms = 8000) => { const end = Date.now() + ms; while (!check()) { if (Date.now() > end) throw Error(message); await wait(30); } };
  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key.startsWith('on')) node.addEventListener(key.slice(2).toLowerCase(), value);
      else if (key in node && !key.startsWith('data-') && !key.startsWith('aria-')) node[key] = value;
      else node.setAttribute(key, value);
    }
    children.flat().filter(value => value != null).forEach(child => node.append(child));
    return node;
  };
  // Original sample groups, in fixed colors yellow, green, blue, purple.
  const GROUPS = [['BASS','PITCH','TONE','NOTE'], ['BANK','STREAM','BED','MOUTH'], ['SPRING','FALL','MARCH','MAY'], ['SEAL','CRANE','BAT','ROBIN']];
  const PALETTE = ['rgb(249, 223, 109)', 'rgb(160, 195, 90)', 'rgb(176, 196, 239)', 'rgb(186, 129, 197)'];
  const board = document.querySelector('[data-testid="connections-board"]'), submit = document.querySelector('#submit'), feedback = document.querySelector('[data-margin-feedback]');
  const chosen = new Set(), guesses = [], submitted = [];
  let clicksOnTiles = 0;
  function paint() {
    for (const tile of board.children) tile.className = `Card-module_label__x${chosen.has(tile.dataset.word) ? ' Card-module_selected__y' : ''}`;
    submit.disabled = chosen.size !== 4;
  }
  // Like NYT: a press selects, a click alone does nothing.
  for (const word of GROUPS.flat().sort()) {
    const tile = el('label', {'data-testid': 'card-label', 'data-word': word}, el('input', {type: 'checkbox', className: 'visually-hidden'}), el('span', {textContent: word}));
    tile.addEventListener('mousedown', () => { if (chosen.has(word)) chosen.delete(word); else if (chosen.size < 4) chosen.add(word); paint(); });
    tile.addEventListener('click', () => clicksOnTiles++);
    board.append(tile);
  }
  document.querySelector('#deselect').addEventListener('click', () => { chosen.clear(); paint(); });
  function say(text) { feedback.textContent = text; setTimeout(() => { if (feedback.textContent === text) feedback.textContent = ''; }, 900); }
  submit.addEventListener('click', () => {
    const guess = [...chosen].sort(), key = guess.join('|');
    submitted.push(guess);
    if (guesses.includes(key)) { say('Already guessed!'); return; }
    guesses.push(key);
    const index = GROUPS.findIndex(group => group.every(word => chosen.has(word)));
    if (index >= 0) {
      setTimeout(() => {
        const row = el('div', {'data-testid': 'solved-category'}, el('strong', {'data-solved-text': '', textContent: `Group ${index + 1}`}), el('p', {}, ...GROUPS[index].map(word => el('span', {'data-solved-word': '', textContent: word + ' '}))));
        row.style.background = PALETTE[index];
        document.querySelector('#solved').append(row);
        for (const word of GROUPS[index]) board.querySelector(`[data-word="${word}"]`).remove();
        chosen.clear(); paint();
      }, 120);
      return;
    }
    document.querySelector('[data-margin-mistakes]').lastElementChild?.remove();
    if (GROUPS.some(group => group.filter(word => chosen.has(word)).length === 3)) say('One away...');
  });
  paint();

  const panel = document.querySelector('#margin-host').attachShadow({mode: 'open'});
  const inline = (name, anchor, position = 'after') => {
    if (!slots.has(name)) { const host = el('div', {'data-margin-inline': name}); const root = host.attachShadow({mode: 'open'}); const container = el('div'); root.append(container); slots.set(name, {host, container}); }
    const slot = slots.get(name);
    if (position === 'before') anchor.before(slot.host); else anchor.after(slot.host);
    return slot.container;
  };
  const features = {}, options = {}, state = {};
  const ctx = {panel, el, state, inline, shadowMode: 'open', save: () => {}, notice: () => {}, settings: {}, isPreview: true,
    feature: name => features[name] !== false, option: (name, fallback) => options[name] ?? fallback,
    setOption: (name, value) => { options[name] = value; adapter.refresh(); }};
  let adapter = MarginGames.connections.mount(ctx);
  const corner = (word, position) => [...document.querySelectorAll('[data-margin-overlay="connections"]')].map(host => host.shadowRoot.querySelector(`[data-word="${word}"][data-corner="${position}"]`)).find(Boolean);
  const markGroup = (words, index) => { for (const word of words) corner(word, ['tl','tr','bl','br'][index]).click(); };
  const action = () => slots.get('connections-undo').container.querySelector('.connection-submit-groups');
  try {
    const shownGroups = () => [...slots.get('connections-tools').container.querySelectorAll('.connection-group')].filter(node => !node.hidden).map(node => Number(node.querySelector('.connection-swatch').dataset.group));
    if (location.search.includes('swap')) {
      // Colors follow NYT's. NYT's yellow group marked green, its green group marked yellow.
      markGroup(GROUPS[0], 1); markGroup(GROUPS[1], 0);
      state.labels[0] = 'Rivers'; state.labels[1] = 'Music'; adapter.refresh();
      assert(action().textContent === 'Submit 2 groups', 'Swapped colors are both ready');
      action().click();
      await until(() => document.querySelectorAll('[data-testid="solved-category"]').length === 2 && !action().textContent.startsWith('Submitting'), 'Swapped groups were not both submitted');
      assert(action().textContent === '2 groups solved' && submitted.length === 2 && submitted[0].join() === [...GROUPS[0]].sort().join(), 'Green goes first; when NYT shows it as yellow, your other group moves to green and is submitted too');
      assert(shownGroups().join() === '2,3' && state.labels[1] === 'B', 'NYT’s yellow and green are retired, and green’s name went back to B');
      // The bug reports: mark NYT's purple group blue. NYT shows purple, so blue stays free and its name resets.
      state.labels[2] = 'Seasons'; state.labels[3] = 'Birds'; adapter.refresh();
      markGroup(GROUPS[3], 2);
      assert(action().textContent === 'Submit 1 group', 'A purple group marked blue is ready');
      action().click();
      await until(() => document.querySelectorAll('[data-testid="solved-category"]').length === 3 && !action().textContent.startsWith('Submitting'), 'The blue-marked group was not submitted');
      await until(() => corner('SPRING', 'bl'), 'Corner marks did not return after the solve');
      assert(shownGroups().join() === '2' && corner('SPRING', 'bl'), 'Blue is still available after NYT reveals the group as purple');
      const blueSwatch = slots.get('connections-tools').container.querySelector('.connection-swatch[data-group="2"]');
      assert(state.labels[2] === 'C' && blueSwatch.textContent === 'C', 'Blue does not take purple’s name; it goes back to the default C');
      corner('SPRING', 'bl').click();
      assert(state.marks.SPRING?.bl === 2, 'You can keep labeling with blue');
      adapter.destroy(); adapter = MarginGames.connections.mount(ctx); adapter.refresh();
      assert(shownGroups().join() === '2' && state.marks.SPRING?.bl === 2, 'After a reload only blue remains and its mark survives');
      adapter.destroy();
      throw { done: true };
    }
    adapter.refresh();
    assert(action() && action().disabled && action().textContent === 'Submit groups', 'Submit groups sits beside the native actions and waits for a ready color');
    const order = panel.querySelector('.connection-submit-order');
    assert(order && !order.hidden && [...order.querySelectorAll('.connection-order-name')].map(n => n.textContent).join() === 'Purple,Blue,Green,Yellow', 'Settings show the Submit order, purple first by default');
    // A wrong purple guess goes first and stops the run.
    markGroup(GROUPS[0], 0); markGroup(GROUPS[1], 1); markGroup(['SEAL', 'CRANE', 'BAT', 'SPRING'], 3);
    assert(action().textContent === 'Submit 3 groups', 'Three colors with four single-color words are ready');
    action().click();
    await until(() => action().textContent === 'One away', 'The run did not stop at One away');
    assert(submitted.length === 1 && submitted[0].includes('SPRING') && !document.querySelector('[data-testid="solved-category"]'), 'Purple goes first by default and its miss stops before green and yellow');
    assert(document.querySelectorAll('[data-margin-mistake]').length === 3, 'Only the one miss costs a mistake');
    // A word with two colors is undecided.
    await until(() => corner('SPRING', 'br'), 'Corner marks did not return after the miss');
    corner('SPRING', 'br').click(); corner('ROBIN', 'br').click(); corner('ROBIN', 'tl').click();
    assert(action().textContent === 'Submit 1 group', 'A word marked with two colors keeps both colors from being ready');
    corner('ROBIN', 'tl').click();
    assert(action().textContent === 'Submit 3 groups', 'Removing the extra color makes them ready again');
    // Change the order: yellow first.
    for (let i = 0; i < 3; i++) order.querySelector('[aria-label="Move Yellow earlier"]').click();
    assert(JSON.stringify(options.submitOrder) === '[0,3,2,1]' && order.querySelector('li').dataset.color === '0', 'Moving Yellow to the top saves the new order');
    // The missed guess stays selected, like NYT. Two stray selections must not leak into the next guess.
    assert(chosen.size === 4, 'The missed guess is still selected');
    document.querySelector('#deselect').click();
    for (const word of ['FALL', 'MAY']) board.querySelector(`[data-word="${word}"]`).dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
    paint(); assert(chosen.size === 2, 'The board starts with two unrelated words selected');
    action().click();
    await until(() => document.querySelectorAll('[data-testid="solved-category"]').length === 3 && !action().textContent.startsWith('Submitting'), 'Ready groups were not all submitted');
    assert(submitted.slice(1).map(guess => guess.join()).join('/') === [GROUPS[0], GROUPS[3], GROUPS[1]].map(group => [...group].sort().join()).join('/'), 'Groups go in your order, yellow, purple, green, without choosing their words');
    assert(document.querySelectorAll('[data-margin-mistake]').length === 3 && action().textContent === '3 groups solved', 'All three correct groups are reported without another mistake');
    assert(clicksOnTiles === 0, 'Words are selected with a press, the way the game expects, not with extra clicks');
    assert((state.attempts || []).length === 4, 'Each automatic submission is saved in Previous tries');
    await wait(3700);
    assert(action().disabled && action().textContent === 'Submit groups', 'The button resets once nothing else is ready');

    features.groupSubmit = false; adapter.refresh();
    assert(action().hidden && order.hidden, 'Turning off Submit marked groups hides the button and its order');
    features.groupSubmit = true; adapter.refresh();
    assert(!action().hidden, 'Turning it back on restores the button');
    adapter.destroy();
  } catch (error) { if (!error?.done) results.push(`FAIL ${error.stack}`); }
  document.querySelector('#results').textContent = results.join('\n');
  document.body.dataset.testStatus = results.some(line => line.startsWith('FAIL')) ? 'failed' : 'passed';
})();
</script>
</html>
