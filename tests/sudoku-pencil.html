<!doctype html>
<meta charset="utf-8">
<title>Margin Sudoku pencil interaction checks</title>
<style>#fixture{display:grid;width:432px;grid-template-columns:repeat(9,48px)}#fixture button{box-sizing:border-box;width:48px;height:48px;border:1px solid #aaa;background:#fff}</style>
<div id="fixture"></div><div id="margin-host"></div><pre id="results"></pre>
<script src="../games/sudoku.js"></script>
<script>
(async () => {
  const output = document.querySelector('#results'), fixture = document.querySelector('#fixture'), host = document.querySelector('#margin-host'), shadow = host.attachShadow({mode:'open'});
  const el = (tag,attrs={},...children) => { const node=document.createElement(tag); for(const [key,value] of Object.entries(attrs)){if(key.startsWith('on'))node.addEventListener(key.slice(2).toLowerCase(),value);else if(key==='className')node.className=value;else if(key==='textContent')node.textContent=value;else node.setAttribute(key,value)}for(const child of children)node.append(child);return node; };
  let checks=0, saves=0;
  const check=(condition,message)=>{if(!condition)throw Error(message);checks++;};
  const button=(text)=>Array.from(shadow.querySelectorAll('button')).find(node=>node.textContent===text||node.getAttribute('aria-label')===text);
  const point=(cell)=>{const r=cell.getBoundingClientRect();return{x:r.x+r.width/2,y:r.y+r.height/2};};
  const pointer=(node,type,p)=>node.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:1,pointerType:'mouse',button:0,clientX:p.x,clientY:p.y}));
  const key=(value)=>{window.dispatchEvent(new KeyboardEvent('keydown',{key:value,bubbles:true,cancelable:true}));window.dispatchEvent(new KeyboardEvent('keyup',{key:value,bubbles:true,cancelable:true}));};
  try {
    fixture.dataset.marginGame='sudoku';
    const cells=Array.from({length:81},(_,index)=>{const node=el('button',{'data-margin-cell':String(index),textContent:index===0?'5':''});if(index===0)node.dataset.given='true';fixture.append(node);return node;});
    const enabled={cornerNotes:true,centerNotes:true,pencilUndo:true};
    let ctx={el,panel:shadow,state:{},settings:{noHints:true},save:()=>saves++,notice:()=>{},isPreview:true,feature:(name,fallback)=>enabled[name]??fallback};
    let adapter=MarginGames.sudoku.mount(ctx);
    check(shadow.querySelectorAll('.sudoku-modes button').length===3,'Sudoku connects to a visible 81-cell board');
    button('Snyder').click();pointer(cells[1],'pointerdown',point(cells[1]));key('1');key('3');
    check(ctx.state.sudokuNotes[1].corner.join('')==='13','Corner notes toggle from keyboard');
    button('Center').click();key('2');key('4');
    check(ctx.state.sudokuNotes[1].center.join('')==='24'&&ctx.state.sudokuNotes[1].corner.join('')==='13','Center and corner notes coexist');
    const noteLayer=document.querySelector('[data-margin-overlay="sudoku"]');
    check(noteLayer.parentElement===fixture&&noteLayer.style.position==='absolute'&&getComputedStyle(fixture).isolation==='isolate','Sudoku notes are contained in the board stacking context');
    const savedPencils=JSON.stringify(ctx.state.sudokuNotes);
    for(const name of ['Pause','Help','Settings']){
      const dialog=el('div',{role:'dialog',style:'position:fixed;inset:20px;background:white;z-index:3',textContent:name});
      document.body.append(dialog);await Promise.resolve();
      check(getComputedStyle(noteLayer).visibility==='hidden',name+' hides both Snyder and Center marks before rendering over the dialog');
      dialog.remove();await Promise.resolve();
      check(getComputedStyle(noteLayer).visibility==='visible'&&JSON.stringify(ctx.state.sudokuNotes)===savedPencils,name+' restores the saved notes after closing');
    }
    const beforeBulk=JSON.stringify(ctx.state.sudokuNotes);
    button('Erase all Center').click();check(ctx.state.sudokuNotes[1].center.length===0&&ctx.state.sudokuNotes[1].corner.join('')==='13','Erase all Center preserves Snyder');
    button('Undo').click();check(JSON.stringify(ctx.state.sudokuNotes)===beforeBulk,'One Undo restores an entire mode erase');
    button('Snyder').click();button('Erase all Snyder').click();check(ctx.state.sudokuNotes[1].corner.length===0&&ctx.state.sudokuNotes[1].center.join('')==='24','Erase all Snyder preserves Center');
    button('Undo').click();button('Center').click();
    button('Erase selected marks').click();
    check(ctx.state.sudokuNotes[1].center.length===0&&ctx.state.sudokuNotes[1].corner.length===2,'Erase affects only current notation mode');
    pointer(cells[0],'pointerdown',point(cells[0]));
    check(!ctx.state.sudokuNotes[0],'Given cells do not receive notes');
    button('Undo').click();
    check(ctx.state.sudokuNotes[1].center.join('')==='24'&&ctx.state.sudokuNotes[1].corner.join('')==='13','Pencil Undo restores an erased center group without changing corner marks');
    button('Snyder').click();button('Undo').click();
    check(ctx.state.sudokuNotes[1].center.join('')==='2','Undo follows the last change across notation mode switches');
    button('Undo').click();button('Undo').click();button('Undo').click();
    check(!ctx.state.sudokuNotes[1]&&button('Undo').disabled,'Undo removes a newly created note and stops when the manual history is empty');
    for(let i=0;i<35;i++)key('1');
    for(let i=0;i<30;i++)button('Undo').click();
    check(ctx.state.sudokuNotes[1].corner.join('')==='1'&&button('Undo').disabled,'Undo keeps exactly the latest 30 changes without deleting older notes');
    button('Center').click();key('2');const enabledNotes=JSON.stringify(ctx.state.sudokuNotes);
    enabled.centerNotes=false;adapter.refresh();
    check(button('Center').hidden&&button('Play').getAttribute('aria-pressed')==='true'&&JSON.stringify(ctx.state.sudokuNotes)===enabledNotes,'Disabling an active pencil mode returns to Play and preserves its notes');
    check([...document.querySelector('[data-margin-overlay="sudoku"]').querySelectorAll('text')].map(node=>node.textContent).join('')==='1','Disabling Center hides only center marks');
    enabled.centerNotes=true;adapter.refresh();
    check(!button('Center').hidden&&[...document.querySelector('[data-margin-overlay="sudoku"]').querySelectorAll('text')].map(node=>node.textContent).join('')==='12','Re-enabling a pencil mode restores its saved marks');
    button('Play').click();check(pointer(cells[2],'pointerdown',point(cells[2])),'Play mode leaves native events alone');
    adapter.destroy();check(!document.querySelector('[data-margin-overlay]'),'Sudoku destroys overlay');
    // The production host places controls into closed-shadow siblings beside native tools.
    const inlineRoots=new Map();
    const inline=(name,anchor,position='after')=>{
      if(!inlineRoots.has(name)){const host=el('div',{'data-margin-inline':name});const root=host.attachShadow({mode:'closed'});const body=el('div');root.append(body);inlineRoots.set(name,{host,body});}
      const entry=inlineRoots.get(name);anchor.insertAdjacentElement(position==='before'?'beforebegin':'afterend',entry.host);return entry.body;
    };
    const inlineButton=(name,label)=>Array.from(inlineRoots.get(name).body.querySelectorAll('button')).find(node=>node.textContent===label||node.getAttribute('aria-label')===label);
    const cleanupInline=()=>{for(const {host} of inlineRoots.values())host.remove();inlineRoots.clear();};
    shadow.replaceChildren();fixture.replaceChildren();fixture.className='';fixture.dataset.marginGame='sudoku';
    const inlineCells=Array.from({length:81},(_,index)=>{const node=el('button',{'data-margin-cell':String(index),textContent:index===0?'5':''});if(index===0)node.dataset.given='true';fixture.append(node);return node;});
    const keypad=el('div',{className:'su-candidates','data-margin-sudoku-keypad':''});fixture.after(keypad);let nativeClicks=0;
    const nativeKeys=Array.from({length:9},(_,index)=>{const node=el('button',{'data-margin-sudoku-digit':String(index+1),textContent:String(index+1),onClick:()=>nativeClicks++});keypad.append(node);return node;});
    const nativeErase=el('button',{'data-testid':'clear-cell',textContent:'Clear cell',onClick:()=>nativeClicks++});keypad.append(nativeErase);
    const nativeUndo=el('button',{'data-testid':'undo-mobile',className:'su-keyboard__undo su-keyboard__undo-mobile',textContent:'Undo',onClick:()=>nativeClicks++});nativeUndo.disabled=true;keypad.append(nativeUndo);
    const nativeToolbar=el('div',{'data-margin-sudoku-toolbar':''});keypad.before(nativeToolbar);
    let nativeAutoClicks=0;const nativeAuto=el('input',{className:'su-keyboard__checkbox',type:'checkbox','data-testid':'sudoku-keyboard-checkbox',name:'lightenComplete',onClick:()=>nativeAutoClicks++});nativeAuto.checked=true;
    const autoLabel=el('label',{className:'su-keyboard__auto'},nativeAuto,document.createTextNode('Auto Candidate Mode'));autoLabel.style.display='flex';keypad.append(autoLabel);
    let normalModeClicks=0;const nativeModeBar=el('div',{className:'su-keyboard__split'},el('button',{'data-testid':'normal-mode',textContent:'Normal',onClick:()=>normalModeClicks++}),el('button',{'data-testid':'candidate-mode',textContent:'Candidate'}));nativeModeBar.style.display='flex';keypad.before(nativeModeBar);
    ctx={el,panel:shadow,state:{},settings:{noHints:true},save:()=>saves++,notice:()=>{},isPreview:true,inline,feature:(name,fallback)=>enabled[name]??fallback};
    adapter=MarginGames.sudoku.mount(ctx);
    check(inlineRoots.get('sudoku-pencil').host.nextElementSibling===nativeModeBar&&nativeModeBar.style.display==='none'&&!shadow.querySelector('.sudoku-modes'),'Sudoku replaces the verified native modebar beside the keypad instead of duplicating it');
    check(normalModeClicks===0,'Mounting replacement controls does not change native game mode');
    check(autoLabel.closest('[data-margin-inline="sudoku-candidates"]')&&nativeAuto.checked&&nativeAutoClicks===0,'The original Auto Candidate checkbox moves to the top without changing state');
    nativeAuto.click();check(!nativeAuto.checked&&nativeAutoClicks===1,'Clicking the moved native checkbox toggles it once');
    nativeAuto.checked=true;adapter.refresh();check(nativeAuto.checked&&nativeAutoClicks===1,'The top control remains the same native input after refresh');
    nativeAuto.disabled=true;nativeAuto.click();check(nativeAuto.checked&&nativeAutoClicks===1,'Disabled native auto candidates cannot be activated');nativeAuto.disabled=false;
    check(inlineRoots.get('sudoku-pencil').host.shadowRoot===null,'Inline tools support the production closed-shadow boundary');
    inlineButton('sudoku-pencil','Snyder').focus();inlineButton('sudoku-pencil','Snyder').click();pointer(inlineCells[1],'pointerdown',point(inlineCells[1]));check(document.activeElement===inlineCells[1],'Selecting a square after clicking Snyder moves focus out of the closed toolbar');
    pointer(nativeKeys[3],'pointerdown',point(nativeKeys[3]));pointer(nativeKeys[3],'pointerup',point(nativeKeys[3]));nativeKeys[3].click();
    check(ctx.state.sudokuNotes[1].corner.join('')==='4'&&nativeClicks===0&&inlineCells[1].textContent==='','Native number clicks create one pencil mark and never enter a game value');
    inlineButton('sudoku-pencil','Center').click();nativeKeys[5].click();
    check(ctx.state.sudokuNotes[1].center.join('')==='6'&&ctx.state.sudokuNotes[1].corner.join('')==='4','Native keypad supports independent center and corner modes');
    check(!nativeUndo.disabled,'Native Undo becomes available for manual pencil history even when NYT has no value history');
    enabled.pencilUndo=false;adapter.refresh();
    check(!nativeUndo.disabled&&inlineButton('sudoku-pencil','Undo').hidden&&inlineButton('sudoku-pencil','Erase selected marks').hidden,'Native Undo stays available while duplicate Undo and erase controls stay hidden');
    enabled.pencilUndo=true;adapter.refresh();
    nativeUndo.click();check(ctx.state.sudokuNotes[1].center.length===0&&ctx.state.sudokuNotes[1].corner.join('')==='4'&&nativeClicks===0,'Native Undo restores the last pencil change without reaching the game handler');
    nativeUndo.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true,cancelable:true}));
    check(!ctx.state.sudokuNotes[1]&&nativeUndo.disabled&&nativeClicks===0,'Keyboard activation of native Undo works across modes and cannot undo game values');
    inlineButton('sudoku-pencil','Snyder').click();nativeKeys[3].click();inlineButton('sudoku-pencil','Center').click();nativeKeys[5].click();
    check(inlineRoots.get('sudoku-pencil').body.querySelector('.margin-sudoku-digits').hidden,'Fallback number buttons stay hidden when the complete native keypad is available');
    nativeErase.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
    check(ctx.state.sudokuNotes[1].center.length===0&&ctx.state.sudokuNotes[1].corner.join('')==='4'&&nativeClicks===0,'Keyboard activation of native erase cannot delete a game value');
    nativeKeys[5].click();nativeErase.click();check(ctx.state.sudokuNotes[1].center.length===0&&ctx.state.sudokuNotes[1].corner.join('')==='4'&&nativeClicks===0,'Native erase clears only the selected pencil mode');
    nativeKeys[5].click();const eraseAllButton=inlineButton('sudoku-pencil','Erase all Center');eraseAllButton.focus();eraseAllButton.click();
    document.activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'8',bubbles:true,cancelable:true,composed:true}));
    check(document.activeElement===inlineCells[1]&&ctx.state.sudokuNotes[1].center.join('')==='8'&&ctx.state.sudokuNotes[1].corner.join('')==='4','Erase all returns keyboard focus to the board so typing continues in the same mode');nativeErase.click();
    const inlineInput=el('input');inlineRoots.get('sudoku-pencil').body.append(inlineInput);inlineInput.dispatchEvent(new KeyboardEvent('keydown',{key:'8',bubbles:true,cancelable:true,composed:true}));
    check(ctx.state.sudokuNotes[1].center.length===0,'Typing inside an inline tool never changes Sudoku marks');inlineInput.remove();
    const keypadModal=el('div',{role:'dialog'},el('button',{'data-margin-sudoku-digit':'8',textContent:'8'}));document.body.append(keypadModal);
    check(pointer(keypadModal.firstChild,'pointerdown',point(nativeKeys[7])),'Native keypad integration leaves modal controls alone');keypadModal.remove();
    inlineButton('sudoku-pencil','Play').click();nativeKeys[2].click();
    check(nativeClicks===1&&normalModeClicks===1&&nativeUndo.disabled,'An explicit Play click selects native Normal mode and restores the keypad and native Undo state');
    const beforeDisabled=JSON.stringify(ctx.state.sudokuNotes);enabled.cornerNotes=false;enabled.centerNotes=false;adapter.refresh();
    check(nativeModeBar.style.display==='flex'&&getComputedStyle(inlineRoots.get('sudoku-pencil').body.querySelector('.sudoku-inline')).display==='none'&&JSON.stringify(ctx.state.sudokuNotes)===beforeDisabled,'Disabling both pencil features restores native mode controls and preserves saved annotations');
    enabled.cornerNotes=true;enabled.centerNotes=true;adapter.refresh();
    check(nativeModeBar.style.display==='none','Re-enabling pencil features replaces the native modebar again without duplication');
    inlineButton('sudoku-pencil','Snyder').click();keypad.remove();adapter.refresh();adapter.refresh();
    check(fixture.nextElementSibling===inlineRoots.get('sudoku-pencil').host&&document.querySelectorAll('[data-margin-inline="sudoku-pencil"]').length===1&&!inlineRoots.get('sudoku-pencil').body.querySelector('.margin-sudoku-digits').hidden&&nativeModeBar.style.display==='flex','Missing native keypad restores original modes, moves the same compact tool below the board, and reveals fallback digits');
    nativeModeBar.after(keypad);adapter.refresh();adapter.destroy();
    check(nativeModeBar.style.display==='flex'&&nativeModeBar.style.getPropertyPriority('display')==='','Destroy restores the native modebar’s original display style');
    check(autoLabel.style.display==='flex'&&autoLabel.style.getPropertyPriority('display')===''&&nativeAuto.checked&&nativeAutoClicks===1,'Destroy restores the native Auto Candidate label and preserves its actual setting');
    nativeModeBar.remove();keypad.remove();cleanupInline();
    check(saves>=8,'Edits request persistence');
    output.textContent=`PASS: ${checks} Sudoku pencil interaction checks`;
    document.documentElement.dataset.testResult='pass';
  } catch(error) { output.textContent=`FAIL: ${error.stack}`; document.documentElement.dataset.testResult='fail'; }
})();
</script>
