name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.7.3'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Prepare and validate version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            node scripts/version.cjs "$REQUESTED_VERSION"
          fi
          node scripts/release-check.cjs
          node scripts/release-notes.cjs > "$RUNNER_TEMP/release-notes.md"
      - run: npm test
      - run: npm run test:browser -- --no-sandbox
      - run: npm run package:publish
      - run: npm run verify:package
      - name: Commit version and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add manifest.json package.json
            if ! git diff --cached --quiet; then
              git commit -m "Release $RELEASE_TAG"
            fi
            git tag "$RELEASE_TAG"
            git push --atomic origin HEAD:main "$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              publish/nyt-swiss-knife-upload.zip \
              publish/nyt-swiss-knife-upload.zip.sha256 --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" \
              publish/nyt-swiss-knife-upload.zip \
              publish/nyt-swiss-knife-upload.zip.sha256 \
              --verify-tag --title "NYT Swiss Knife $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
